<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="RKHUB Tools">
  <title>RKHUB Tools</title>
  <defs>
    <!-- iOS-style squircle gradient. Deliberately not saffron/white/green and
         not a state emblem: this is a private product mark, not a national or
         government symbol. -->
    <linearGradient id="rkSquircle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5AC8FA"/>
      <stop offset="48%"  stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0A3FCF"/>
    </linearGradient>
    <linearGradient id="rkSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Superellipse-style rounded square (continuous corner, iOS app-icon shape) -->
  <rect x="2" y="2" width="124" height="124" rx="29" ry="29" fill="url(#rkSquircle)"/>
  <rect x="2" y="2" width="124" height="124" rx="29" ry="29" fill="url(#rkSheen)"/>
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="28.5" ry="28.5"
        fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1.5"/>

  <!-- Monogram -->
  <g fill="#FFFFFF">
    <!-- R -->
    <path d="M38 40h16.2c8.1 0 13.1 4.1 13.1 10.7 0 4.6-2.5 7.9-6.6 9.4L69.2 80H58.9l-7.2-18.1h-3.6V80H38V40Zm10.1 8.6v6.2h5.3c2.6 0 4.1-1.2 4.1-3.1s-1.5-3.1-4.1-3.1h-5.3Z"/>
    <!-- K -->
    <path d="M72 40h10.1v16.6L93.4 40H104L90.2 58.3 105 80H94.1L85.6 64.1l-3.5 3.7V80H72V40Z"/>
  </g>
</svg>
